<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>บันทึกการปฏิบัติงาน</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-page">
  <main class="container">
    <header class="topbar">
      <div>
        <div class="eyebrow">WORK LOG</div>
        <h1>บันทึกการปฏิบัติงาน</h1>
      </div>
      <div class="topbar-actions">
        <button id="menuBtn" class="icon-btn" title="เมนู">☰</button>
        <button id="closeBtn" class="icon-btn close-btn" title="ปิดหน้าบันทึกงาน" aria-label="ปิด">✕</button>
      </div>
    </header>

    <div id="quickMenu" class="quick-menu hidden" aria-label="เมนูลัด">
      <button type="button" id="dashboardBtn">📊 Dashboard</button>
      <button type="button" id="settingsBtn">⚙️ ตั้งค่า</button>
    </div>

    <div id="configWarning" class="notice warning hidden"></div>

    <form id="workLogForm">
      <div class="grid-2">
        <label>
          วันที่
          <div class="thai-date-field" data-thai-date="workDate">
            <input type="text" id="workDateDisplay" autocomplete="off" placeholder="วัน เดือน พ.ศ." required>
            <input type="hidden" id="workDate" required>
            <button type="button" class="thai-calendar-btn" aria-label="เปิดปฏิทิน">📅</button>
            <div class="thai-calendar-popup hidden"></div>
          </div>
        </label>
        <label>
          ช่วงเวลา
          <select id="timePeriod" required>
            <option value="">เลือกช่วงเวลา</option>
            <option value="08:00 - 12:00">🌅 08:00 - 12:00 (เช้า)</option>
            <option value="13:00 - 17:00">🌤️ 13:00 - 17:00 (บ่าย)</option>
            <option value="ล่วงเวลา (OT)">🌙 ล่วงเวลา (OT)</option>
            <option value="กำหนดเอง">🕐 กำหนดเอง</option>
          </select>
          <div id="customTimeBox" class="custom-time-box hidden">
            <div>
              <span>เวลาเริ่ม</span>
              <input type="text" id="customStartTime" inputmode="numeric" maxlength="5" placeholder="HH:mm" autocomplete="off">
            </div>
            <span class="time-separator">ถึง</span>
            <div>
              <span>เวลาสิ้นสุด</span>
              <input type="text" id="customEndTime" inputmode="numeric" maxlength="5" placeholder="HH:mm" autocomplete="off">
            </div>
            <small>🕐 รูปแบบ 24 ชั่วโมง: <b>HH:mm</b> เช่น 08:00, 13:00, 18:30 • ค่าเริ่มต้นอิงจากเวลาปัจจุบัน</small>
          </div>
        </label>
      </div>

      <label>
        ประเภทงาน
        <input type="text" id="category" placeholder="เช่น งานวิจัย, งานระบบ, ประชุม">
      </label>

      <label>
        ชื่องาน / หัวข้อ
        <input type="text" id="taskName" placeholder="เช่น จัดทำรายงานผลการวิจัย" required>
      </label>

      <label>
        รายละเอียดการทำงาน
        <textarea id="details" rows="4" placeholder="ระบุรายละเอียดงานที่ทำสำเร็จ..." required></textarea>
      </label>

      <div class="section-title">
        <span>📎 เอกสารหลักฐาน</span>
        <small id="fileCount">0 ไฟล์</small>
      </div>

      <label class="dropzone" for="evidenceFiles">
        <input type="file" id="evidenceFiles" multiple>
        <strong>คลิกเพื่อเลือกไฟล์</strong>
        <span>สามารถเลือกหลายไฟล์ใน 1 งาน</span>
      </label>

      <div id="fileList" class="file-list"></div>

      <label>
        Link งาน (ถ้ามี)
        <input type="url" id="workUrl" placeholder="https://...">
      </label>

      <label>
        สถานะ
        <select id="status"></select>
      </label>

      <div class="actions">
        <button type="button" id="clearBtn" class="btn secondary">🧹 ล้าง</button>
        <button type="submit" id="submitBtn" class="btn primary">
          <span id="submitText">💾 บันทึกงาน</span>
          <span id="spinner" class="spinner hidden"></span>
        </button>
      </div>
    </form>

    <div id="toast" class="toast hidden"></div>
  </main>

  <script src="utils.js"></script>
  <script src="thai-date-picker.js"></script>
  <script src="google-api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
