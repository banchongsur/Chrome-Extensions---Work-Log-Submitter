<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Log Submitter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- ส่วนหัว -->
        <header>
            <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 9h-2V7h-2v7h4v-2zm-3 7H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z"/>
            </svg>
            <h2>บันทึกการปฏิบัติงาน</h2>
        </header>
        
        <!-- ฟอร์มกรอกข้อมูล -->
        <form id="workLogForm">
            <div class="form-group">
                <label for="taskName">ชื่องาน / หัวข้อ</label>
                <input type="text" id="taskName" name="taskName" placeholder="เช่น สรุปรายงานการวิจัย, ปรับปรุงระบบ..." required>
            </div>
            
            <div class="form-group">
                <label for="timePeriod">ช่วงเวลา</label>
                <select id="timePeriod" name="timePeriod" required>
                    <option value="" disabled selected>เลือกช่วงเวลา...</option>
                    <option value="08:30 - 12:00">08:30 - 12:00 (เช้า)</option>
                    <option value="13:00 - 16:30">13:00 - 16:30 (บ่าย)</option>
                    <option value="ล่วงเวลา (OT)">ล่วงเวลา (OT)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="details">รายละเอียดการทำงาน</label>
                <textarea id="details" name="details" rows="3" placeholder="ระบุรายละเอียดงานที่ทำสำเร็จ..." required></textarea>
            </div>
            
            <button type="submit" id="submitBtn" class="btn-primary">
                <span id="btnText">บันทึกข้อมูล</span>
                <!-- Loading Spinner (ซ่อนไว้ตอนเริ่มต้น) -->
                <svg id="loadingSpinner" class="spinner" viewBox="0 0 50 50" style="display: none;">
                    <circle cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
                </svg>
            </button>
        </form>

        <!-- ส่วนแสดงผลลัพธ์ (Toast Notification) -->
        <div id="toast" class="toast"></div>
    </div>

    <!-- ลิงก์ไปยังไฟล์ JavaScript -->
    <script src="popup.js"></script>
</body>
</html>
